<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frizerski Salon - Zakazivanje Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            height: 680px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 28px 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
            font-weight: 400;
        }

        .header-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #f8f9fa;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 85%;
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: white;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .service-button {
            padding: 14px 16px;
            background: white;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            transition: all 0.25s ease;
            color: #2d3748;
        }

        .service-button:hover {
            background: #f8fafc;
            border-color: #f5576c;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.15);
            transform: translateY(-2px);
        }

        .service-button:active {
            transform: scale(0.98);
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .input-label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .confirmation-box {
            background: linear-gradient(135deg, #f8f9fa 0%, #f0f1f3 100%);
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 12px;
        }

        .confirmation-box h3 {
            font-size: 16px;
            color: #2d3748;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .confirmation-box p {
            font-size: 13px;
            color: #718096;
            line-height: 1.6;
        }

        .confirmation-box .checkmark {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            color: #e53e3e;
            font-size: 12px;
            margin-top: 4px;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .restart-button {
            width: 100%;
            padding: 11px;
            background: #f0f1f3;
            color: #2d3748;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .restart-button:hover {
            background: #e2e8f0;
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-icon">✂️</div>
            <h1>Zakazi Frizuru</h1>
            <p>Rezerviši termin u 30 sekundi</p>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea"></div>

        <!-- INPUT AREA -->
        <div class="input-area">
            <!-- SERVICE SELECTION -->
            <div id="serviceSelect" class="button-group">
                <button class="service-button" onclick="selectService('Sisanje', 30)">
                    ✂️ Šišanje (30 min)
                </button>
                <button class="service-button" onclick="selectService('Boja i balayage', 60)">
                    🎨 Boja i balayage (60 min)
                </button>
                <button class="service-button" onclick="selectService('Keratin tretman', 90)">
                    💆 Keratin tretman (90 min)
                </button>
                <button class="service-button" onclick="selectService('Kompletan paket', 120)">
                    👑 Šišanje + Boja + Tretman (2h)
                </button>
            </div>

            <!-- NAME INPUT -->
            <div id="nameInput" class="hidden">
                <div class="form-group">
                    <input type="text" id="nameField" class="input-field" placeholder="Unesite vaše ime" />
                    <span id="nameError" class="error-message hidden"></span>
                    <button class="submit-button" onclick="nextStep('name')">Dalje →</button>
                </div>
            </div>

            <!-- PHONE INPUT -->
            <div id="phoneInput" class="hidden">
                <div class="form-group">
                    <input type="tel" id="phoneField" class="input-field" placeholder="+381 60 123 4567" />
                    <span id="phoneError" class="error-message hidden"></span>
                    <button class="submit-button" onclick="nextStep('phone')">Dalje →</button>
                </div>
            </div>

            <!-- HAIRDRESSER SELECTION -->
            <div id="stylistInput" class="hidden">
                <div class="form-group">
                    <label class="input-label">Preferovani frizerski majstor</label>
                    <select id="stylistField">
                        <option>Marija - Specijalist za boju</option>
                        <option>Aleksandar - Sisanje i dizajn</option>
                        <option>Jelena - Tretmani i nega</option>
                        <option>Bilo ko dostupan</option>
                    </select>
                    <button class="submit-button" onclick="nextStep('stylist')">Dalje →</button>
                </div>
            </div>

            <!-- TIME INPUT -->
            <div id="timeInput" class="hidden">
                <div class="form-group">
                    <label class="input-label">Kada vam odgovara?</label>
                    <select id="timeField">
                        <option>Ponedeljak 10:00</option>
                        <option>Ponedeljak 12:00</option>
                        <option>Ponedeljak 14:00</option>
                        <option>Ponedeljak 16:00</option>
                        <option>Utorak 10:00</option>
                        <option>Utorak 13:00</option>
                        <option>Utorak 15:00</option>
                        <option>Utorak 17:00</option>
                        <option>Sreda 11:00</option>
                        <option>Sreda 14:00</option>
                        <option>Sreda 16:00</option>
                        <option>Četvrtak 10:00</option>
                        <option>Četvrtak 12:00</option>
                        <option>Četvrtak 15:00</option>
                        <option>Petak 10:00</option>
                        <option>Petak 14:00</option>
                        <option>Petak 16:00</option>
                        <option>Subota 10:00</option>
                        <option>Subota 13:00</option>
                    </select>
                    <button class="submit-button" onclick="nextStep('time')">Potvrdi Rezervaciju</button>
                </div>
            </div>

            <!-- CONFIRMATION -->
            <div id="confirmation" class="hidden">
                <div class="confirmation-box">
                    <div class="checkmark">✅</div>
                    <h3>Rezervacija je potvrđena!</h3>
                    <p>Detalji su poslati na vaš telefon. Očekujemo vas! Hvala što ste nas odabrali.</p>
                </div>
                <button class="restart-button" onclick="location.reload()">Nova Rezervacija</button>
            </div>
        </div>
    </div>

    <script>
        let bookingData = {};

        function addMessage(text, isUser = false) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function selectService(service, duration) {
            bookingData.service = service;
            bookingData.duration = duration;
            
            addMessage(`${service} (${duration} min)`, true);
            
            document.getElementById('serviceSelect').classList.add('hidden');
            document.getElementById('nameInput').classList.remove('hidden');
            
            setTimeout(() => {
                addMessage('Kako se zoveš?');
                document.getElementById('nameField').focus();
            }, 300);
        }

        function nextStep(field) {
            const nameField = document.getElementById('nameField');
            const phoneField = document.getElementById('phoneField');
            const stylistField = document.getElementById('stylistField');
            const timeField = document.getElementById('timeField');
            const nameError = document.getElementById('nameError');
            const phoneError = document.getElementById('phoneError');
            
            if (field === 'name') {
                const name = nameField.value.trim();
                
                if (!name) {
                    nameError.textContent = 'Unesite vaše ime';
                    nameError.classList.remove('hidden');
                    nameField.focus();
                    return;
                }
                
                nameError.classList.add('hidden');
                bookingData.name = name;
                addMessage(name, true);
                
                document.getElementById('nameInput').classList.add('hidden');
                document.getElementById('phoneInput').classList.remove('hidden');
                
                setTimeout(() => {
                    addMessage('Koji je vaš broj telefona?');
                    phoneField.focus();
                }, 300);
            }
            
            else if (field === 'phone') {
                const phone = phoneField.value.trim();
                
                if (!phone) {
                    phoneError.textContent = 'Unesite broj telefona';
                    phoneError.classList.remove('hidden');
                    phoneField.focus();
                    return;
                }
                
                phoneError.classList.add('hidden');
                bookingData.phone = phone;
                addMessage(phone, true);
                
                document.getElementById('phoneInput').classList.add('hidden');
                document.getElementById('stylistInput').classList.remove('hidden');
                
                setTimeout(() => {
                    addMessage('Koji frizerski majstor vam je drag?');
                    stylistField.focus();
                }, 300);
            }

            else if (field === 'stylist') {
                const stylist = stylistField.value;
                bookingData.stylist = stylist;
                addMessage(stylist, true);
                
                document.getElementById('stylistInput').classList.add('hidden');
                document.getElementById('timeInput').classList.remove('hidden');
                
                setTimeout(() => {
                    addMessage('Kada bi vam odgovaralo?');
                    timeField.focus();
                }, 300);
            }
            
            else if (field === 'time') {
                const time = timeField.value;
                bookingData.time = time;
                addMessage(time, true);
                
                document.getElementById('timeInput').classList.add('hidden');
                document.getElementById('confirmation').classList.remove('hidden');
                
                setTimeout(() => {
                    const summary = `Odličan izbor! Vaša rezervacija:\n\n📌 Usluga: ${bookingData.service}\n⏰ Vreme: ${time}\n💇 Majstor: ${bookingData.stylist}\n📞 Kontakt: ${bookingData.phone}\n\nVidećemo se! ✨`;
                    addMessage(summary);
                }, 300);
            }
        }

        // Initial message
        window.addEventListener('load', () => {
            addMessage('Zdravo! 👋 Dobrodošli u naš salon! Šta vas zanima?');
        });

        // Allow Enter key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (!document.getElementById('nameInput').classList.contains('hidden')) {
                    nextStep('name');
                } else if (!document.getElementById('phoneInput').classList.contains('hidden')) {
                    nextStep('phone');
                }
            }
        });
    </script>
</body>
</html>
